# Host nginx site for the Unchartered Podcast.
# Installed as /etc/nginx/sites-available/podcast (symlinked into sites-enabled).
# The app container listens on 127.0.0.1:3100.
#
# Certificates (Let's Encrypt, auto-renewed by certbot.timer):
#   theuncharted   -> theuncharted.show, www.theuncharted.show
#   podcast-sslip  -> podcast-82-197-69-44.sslip.io (test hostname)

# ---- HTTP: everything goes to https://theuncharted.show ----
server {
    listen 80;
    listen [::]:80;
    server_name theuncharted.show www.theuncharted.show;
    return 301 https://theuncharted.show$request_uri;
}

# ---- HTTPS www -> apex ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.theuncharted.show;

    ssl_certificate /etc/letsencrypt/live/theuncharted/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theuncharted/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://theuncharted.show$request_uri;
}

# ---- HTTPS production site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theuncharted.show;

    ssl_certificate /etc/letsencrypt/live/theuncharted/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theuncharted/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# ---- Test hostname (kept for staging checks) ----
server {
    listen 80;
    listen [::]:80;
    server_name podcast-82-197-69-44.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name podcast-82-197-69-44.sslip.io;

    ssl_certificate /etc/letsencrypt/live/podcast-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podcast-sslip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
