<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="portraitGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A2840" />
      <stop offset="60%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#070C16" />
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CF96" />
      <stop offset="100%" stop-color="#C9A961" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#portraitGrad)" />
  <rect x="20" y="20" width="760" height="960" rx="16" fill="none" stroke="#1F2E47" stroke-width="2" />
  
  <!-- Stylized Leader Silhouette -->
  <g transform="translate(400, 440)" opacity="0.6">
    <!-- Head -->
    <circle cx="0" cy="-120" r="100" fill="#152238" stroke="url(#goldGrad2)" stroke-width="2" />
    <!-- Shoulders / Torso -->
    <path d="M -180 180 C -180 40, -100 0, 0 0 C 100 0, 180 40, 180 180 Z" fill="#152238" stroke="url(#goldGrad2)" stroke-width="2" />
  </g>

  <!-- Typography badge -->
  <rect x="260" y="720" width="280" height="42" rx="21" fill="#121C2F" stroke="#C9A961" stroke-width="1.5" />
  <text x="400" y="747" font-family="sans-serif" font-size="14" font-weight="600" fill="#C9A961" text-anchor="middle" letter-spacing="3">
    FEATURED LEADER
  </text>
  <text x="400" y="810" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    Unchartered Guest
  </text>
</svg>
