<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="grad" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1B2943" />
      <stop offset="60%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#070C16" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CF96" />
      <stop offset="100%" stop-color="#C9A961" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#grad)" />
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#1F2E47" stroke-width="2" />
  
  <!-- Waveform / Geometric Graphic -->
  <g transform="translate(640, 320)" opacity="0.4">
    <rect x="-180" y="-30" width="12" height="60" rx="6" fill="#C9A961" />
    <rect x="-140" y="-60" width="12" height="120" rx="6" fill="#C9A961" />
    <rect x="-100" y="-100" width="12" height="200" rx="6" fill="#C9A961" />
    <rect x="-60" y="-50" width="12" height="100" rx="6" fill="#C9A961" />
    <rect x="-20" y="-80" width="12" height="160" rx="6" fill="#C9A961" />
    <rect x="20" y="-120" width="12" height="240" rx="6" fill="#C9A961" />
    <rect x="60" y="-70" width="12" height="140" rx="6" fill="#C9A961" />
    <rect x="100" y="-110" width="12" height="220" rx="6" fill="#C9A961" />
    <rect x="140" y="-40" width="12" height="80" rx="6" fill="#C9A961" />
    <rect x="180" y="-20" width="12" height="40" rx="6" fill="#C9A961" />
  </g>

  <!-- Central Play Icon Ring -->
  <circle cx="640" cy="340" r="54" fill="#121C2F" stroke="url(#goldGrad)" stroke-width="3" />
  <polygon points="632,320 658,340 632,360" fill="url(#goldGrad)" />

  <!-- Typography -->
  <text x="640" y="470" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
    UNCHARTERED
  </text>
  <text x="640" y="510" font-family="sans-serif" font-size="16" font-weight="500" fill="#C9A961" text-anchor="middle" letter-spacing="4">
    LEGENDS &amp; LEGACIES
  </text>
</svg>
