version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unchartered_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unchartered_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d unchartered_db']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unchartered_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URI: postgresql://postgres:postgrespassword@postgres:5432/unchartered_db
      PAYLOAD_SECRET: docker-payload-production-secret-min-32-chars
      SEED_DEMO: 'true'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Please set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Please set SEED_ADMIN_PASSWORD in .env}
    volumes:
      - app_media:/app/media

volumes:
  pgdata:
  app_media:
