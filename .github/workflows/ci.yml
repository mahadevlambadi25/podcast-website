name: CI & Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: unchartered_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PAYLOAD_SECRET: a-very-secure-payload-secret-for-ci-tests-at-least-32-chars-long
      DATABASE_URI: postgresql://postgres:postgrespassword@localhost:5432/unchartered_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRON_SECRET: super-secure-cron-token-ci-32-chars
      SEED_ADMIN_EMAIL: admin@ci-unchartered.com
      SEED_ADMIN_PASSWORD: TestAdminPassword123!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Linter
        run: npm run lint

      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test

      - name: Build Production Application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URI: postgresql://postgres:postgrespassword@localhost:5432/unchartered_test
          PAYLOAD_SECRET: a-very-secure-payload-secret-for-ci-tests-at-least-32-chars-long
          CRON_SECRET: super-secure-cron-token-ci-32-chars
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
