databases:
  - name: unchartered-postgres
    plan: starter
    databaseName: unchartered
    user: unchartered_user

services:
  # Web application service (Next.js + Custom CMS + PostgreSQL)
  - type: web
    name: unchartered-podcast-web
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node ./scripts/migrate-postgres.mjs && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: unchartered-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: unchartered-media-uploads
      mountPath: /app/media
      sizeGB: 10

  # Scheduled publishing cron (runs every 10 minutes to auto-publish scheduled episodes)
  - type: cron
    name: unchartered-publish-cron
    env: node
    schedule: "*/10 * * * *"
    buildCommand: ""
    startCommand: 'curl -fsS -X POST "${NEXT_PUBLIC_SITE_URL}/api/cron/publish" -H "Authorization: Bearer ${CRON_SECRET}" || true'
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: unchartered-podcast-web
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: unchartered-podcast-web
          envVarKey: CRON_SECRET
